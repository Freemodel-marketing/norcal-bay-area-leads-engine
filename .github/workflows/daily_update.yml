name: Actualizacion Semanal de Leads

on:
  schedule:
    # 0 5 * * 1 -> 5:00 AM UTC cada lunes (1:00 AM Eastern Time aprox)
    - cron: '0 5 * * 1'
  workflow_dispatch: # Esto te permite seguir ejecutándolo manualmente si quieres

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar motor de extraccion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RENCATS_API_KEY_GILBERTO: ${{ secrets.RENCAST_API_KEY_GILBERTO }}
        run: python Sale_Listings_4_0.py
