name: Actualizacion Diaria de Leads

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actualizado de v3 a v4
      - name: Descargar codigo del repo
        uses: actions/checkout@v4

      # Actualizado de v4 a v5
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar librerias
        run: pip install -r requirements.txt

      - name: Ejecutar script de extraccion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
        run: python Sale_Listings_2_0.py
