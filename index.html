<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Agent Marketing Outline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #f1f5f9; color: #1e293b; }
        .card { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 0.75rem; }
        .table-header { background-color: #f8fafc; border-bottom: 2px solid #e2e8f0; }
        tr:hover { background-color: #f1f5f9; transition: background 0.2s; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">Real Estate Leads</h1>
                <p class="text-slate-500 text-lg">Bay Area Automated Daily Intelligence</p>
            </div>
            <div id="counter" class="bg-white text-blue-600 border border-blue-200 font-semibold px-4 py-2 rounded-lg shadow-sm">
                Loading database...
            </div>
        </header>

        <div class="card p-6 mb-8 shadow-sm">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">County Filter</label>
                    <select id="filterCounty" class="w-full bg-slate-50 border border-slate-300 text-slate-900 p-2.5 rounded-lg focus:ring-blue-500 focus:border-blue-500 outline-none">
                        <option value="">All Counties</option>
                        <option value="Alameda">Alameda</option>
                        <option value="San Mateo">San Mateo</option>
                        <option value="San Francisco">San Francisco</option>
                        <option value="Santa Clara">Santa Clara</option>
                        <option value="Contra Costa">Contra Costa</option>
                        <option value="Marin">Marin</option>
                        <option value="Napa">Napa</option>
                        <option value="Sonoma">Sonoma</option>
                        <option value="Monterey">Monterey</option>
                    </select>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-700 mb-2">Global Search</label>
                    <input type="text" id="searchInput" placeholder="Search by Agent, Address, or Office..." 
                           class="w-full bg-slate-50 border border-slate-300 text-slate-900 p-2.5 rounded-lg focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
                
                <div class="flex items-end gap-2">
                    <button onclick="fetchLeads()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-lg transition-colors shadow-md text-sm">
                        Refresh
                    </button>
                    <button onclick="downloadCSV()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-lg transition-colors shadow-md text-sm flex items-center justify-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        CSV
                    </button>
                </div>
            </div>
        </div>

        <div class="card shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="table-header text-slate-600 uppercase text-xs font-bold">
                            <th class="p-5">Address</th>
                            <th class="p-5">Price</th>
                            <th class="p-5">County</th>
                            <th class="p-5 text-center">Days on Market</th>
                            <th class="p-5">Listing Agent</th>
                            <th class="p-5">Contact Details</th>
                            <th class="p-5">Office</th>
                        </tr>
                    </thead>
                    <tbody id="leadsTableBody" class="text-sm divide-y divide-slate-200">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://bwnayhlmbmqaejnultnv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_wKb37bYCu3Rf23oeEwXhlQ_pGycz85a';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentData = []; // Variable global para guardar los datos filtrados

        async function fetchLeads() {
            const tableBody = document.getElementById('leadsTableBody');
            const counter = document.getElementById('counter');
            const county = document.getElementById('filterCounty').value;
            const search = document.getElementById('searchInput').value;

            tableBody.innerHTML = '<tr><td colspan="7" class="p-20 text-center text-slate-400 font-medium">Fetching fresh leads...</td></tr>';

            let query = _supabase.from('leads_ventas').select('*');
            if (county) query = query.eq('county', county);
            if (search) query = query.or(`agent_name.ilike.%${search}%,address.ilike.%${search}%,office_name.ilike.%${search}%`);
            query = query.order('days_on_market', { ascending: false });

            const { data, error } = await query;
            if (error) { tableBody.innerHTML = 'Error loading data'; return; }

            currentData = data; // Guardamos los datos para el CSV
            counter.innerText = `${data.length} Properties Identified`;
            tableBody.innerHTML = '';

            data.forEach(lead => {
                const row = `
                    <tr class="bg-white">
                        <td class="p-5 font-semibold text-slate-800">${lead.address || 'N/A'}</td>
                        <td class="p-5 text-blue-700 font-bold">$${Number(lead.price).toLocaleString()}</td>
                        <td class="p-5 text-slate-500 uppercase text-xs font-medium">${lead.county || 'N/A'}</td>
                        <td class="p-5 text-center">
                            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold ${lead.days_on_market > 30 ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'}">
                                ${lead.days_on_market || 0} Days
                            </span>
                        </td>
                        <td class="p-5 text-slate-900 font-bold">${lead.agent_name || 'N/A'}</td>
                        <td class="p-5 text-slate-600 text-xs">${lead.agent_phone || 'N/A'} | ${lead.agent_email || ''}</td>
                        <td class="p-5 text-xs text-slate-400 italic">${lead.office_name || 'N/A'}</td>
                    </tr>`;
                tableBody.innerHTML += row;
            });
        }

        // --- FUNCIÓN PARA DESCARGAR CSV ---
        function downloadCSV() {
            if (currentData.length === 0) {
                alert("No data available to download.");
                return;
            }

            // Definimos los encabezados
            const headers = ['Address', 'Price', 'County', 'Days on Market', 'Agent Name', 'Agent Phone', 'Agent Email', 'Office'];
            
            // Mapeamos los datos de Supabase al formato de filas CSV
            const csvRows = [
                headers.join(','), // Primera fila con encabezados
                ...currentData.map(row => [
                    `"${row.address || ''}"`,
                    row.price,
                    `"${row.county || ''}"`,
                    row.days_on_market,
                    `"${row.agent_name || ''}"`,
                    `"${row.agent_phone || ''}"`,
                    `"${row.agent_email || ''}"`,
                    `"${row.office_name || ''}"`
                ].join(','))
            ];

            const csvContent = "data:text/csv;charset=utf-8," + csvRows.join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Leads_Report_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        fetchLeads();
        document.getElementById('filterCounty').addEventListener('change', fetchLeads);
        document.getElementById('searchInput').addEventListener('input', () => {
            clearTimeout(window.searchTimer);
            window.searchTimer = setTimeout(fetchLeads, 300);
        });
    </script>
</body>
</html>
